<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hey Babes 💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff69b4, #9b59b6, #ff1493);
    background-size: 400% 400%;
    animation: backgroundMove 8s ease infinite;
}

.container {
    text-align: center;
    color: white;
    z-index: 2;
}

h1 {
    font-size: 90px;
    font-weight: bold;
    text-shadow: 0 0 20px rgba(255,255,255,0.8);
    animation: pulse 2s infinite;
}

.heart {
    font-size: 100px;
    margin-top: 20px;
    animation: heartbeat 1.2s infinite;
}

.floating-heart {
    position: absolute;
    font-size: 30px;
    animation: float 6s linear infinite;
}

.heart1 { left: 10%; animation-delay: 0s; }
.heart2 { left: 30%; animation-delay: 2s; }
.heart3 { left: 70%; animation-delay: 1s; }
.heart4 { left: 90%; animation-delay: 3s; }

@keyframes backgroundMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
}

@keyframes float {
    0% {
        bottom: -50px;
        opacity: 0;
        transform: translateX(0);
    }
    20% {
        opacity: 1;
    }
    100% {
        bottom: 110%;
        opacity: 0;
        transform: translateX(100px) rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="floating-heart heart1">💗</div>
<div class="floating-heart heart2">💖</div>
<div class="floating-heart heart3">💕</div>
<div class="floating-heart heart4">💗</div>

<div class="container">
    <h1>HEY BABES<br>LOVE YOU</h1>
    <div class="heart">❤️</div>
</div>

</body>
</html>
